name: Salesforce CI (Dev & QA)

on:
  push:
    branches:
      - develop
      - qa

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # ---------------- DEV AUTH ----------------
      - name: Authenticate DEV sandbox
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf auth sfdxurl store \
            --sfdx-url-file auth.txt \
            --alias dev \
            --set-default

      # ---------------- QA AUTH ----------------
      - name: Authenticate QA sandbox
        if: github.ref == 'refs/heads/qa'
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf auth sfdxurl store \
            --sfdx-url-file auth.txt \
            --alias qa \
            --set-default

      # ---------------- SAFETY CHECK ----------------
      - name: Safety check – block production
        run: |
          IS_PROD=$(sf org display --json | jq -r '.result.isProduction')
          if [ "$IS_PROD" = "true" ]; then
            echo "❌ Production org detected. Stopping deployment."
            exit 1
          fi
          echo "✅ Sandbox confirmed"

      # ---------------- DEPLOY ----------------
      - name: Deploy metadata
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests
