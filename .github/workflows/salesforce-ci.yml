name: Salesforce CI (Sandbox Only)

on:
  push:
    branches:
      - develop   

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      - name: Authenticate to Salesforce (SANDBOX ONLY)
        run: |
          echo "${{ secrets.SFDX_AUTH_URL }}" > auth.txt
          sf auth sfdxurl store \
            --sfdx-url-file auth.txt \
            --alias dev \
            --set-default

      # 🔒 HARD SAFETY CHECK – BLOCK PROD
      - name: Safety check – block production
        run: |
          sf org display --json | jq -e '.result.isProduction == false'

      - name: Deploy metadata to Sandbox
        run: |
          sf project deploy start \
            --source-dir force-app \
            --test-level RunLocalTests
