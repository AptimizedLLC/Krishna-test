<template>
    <lightning-card title="Send back to Floor Staff">
        
        <div class="slds-m-around_medium">
            <lightning-record-edit-form object-api-name={objectApiName} record-id={recordId}  onsuccess={handleSuccess} onerror={handleError}>

            <lightning-messages></lightning-messages>
            

                <lightning-input-field field-name={assignedField} required></lightning-input-field>
                <lightning-input-field field-name={note} ></lightning-input-field>
                <lightning-input-field field-name={status} value="Sent Back To Floor staff" class="slds-hide"></lightning-input-field>
                <lightning-input-field field-name={FlowsheetUpdated} value="True" class="slds-hide"></lightning-input-field>

                <div class="button-group slds-m-top_medium">
               
                    <div class="slds-var-m-top_medium">
                        <lightning-button variant="brand" type="submit" label="Save">
                        </lightning-button>
                    </div>
                </div>
            </lightning-record-edit-form>
        </div>
        
    </lightning-card>
</template>
