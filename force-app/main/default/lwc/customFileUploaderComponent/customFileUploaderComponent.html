<template>
    <lightning-card title='File Uploader' icon-name='custom:custom19'>
        <template if:true={isPhone}>
            <p style='color: red; text-align: center;'>You are using a phone</p>
        </template>
        <template if:false={isPhone}>
            <p style='color: red; text-align: center;'>You are not using a phone***</p>
        </template>
        <lightning-file-upload
            label='Attach Receipt'
            name='fileUploader'
            accept={acceptedFormats}
            record-id={recordId}
            onuploadfinished={handleUploadFinished}
            multiple>
        </lightning-file-upload>
    </lightning-card>
</template>
