<template>
    <lightning-modal-header label={headerText}></lightning-modal-header>
    <lightning-modal-body>{content}</lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancel"  style="width:30%" onclick={handleOkay}></lightning-button>
        <lightning-button label="Yes, begin a new set of flowsheet entries for this patient" style="width:70%" onclick={handleNotOkay}></lightning-button>
    </lightning-modal-footer>
</template>
